[project]
name = "password-manager"
version = "0.1.0"
description = "A local, encrypted desktop password manager for application and server credentials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8.0",
    "openpyxl>=3.1.0",
    "sqlcipher3-wheels==0.5.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "PyInstaller>=6.11.0",
]

[project.scripts]
password-manager = "password_manager.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
